# Vale config for IEEE Access manuscript
# Designed for academic LaTeX papers

StylesPath = styles
MinAlertLevel = suggestion

# Style packages to download via `vale sync`
Packages = Microsoft, write-good, proselint, Readability

# Vocab for technical terms specific to this paper
Vocab = LLM

# LaTeX file format
[*.tex]
BasedOnStyles = Vale, Microsoft, write-good, proselint

# Skip LaTeX commands, math, and citations
TokenIgnores = (\\[a-zA-Z]+\{[^}]*\}), (\\\\), (\$[^$]+\$), (\\\([^)]+\\\)), (\\\[[^]]+\\\])
BlockIgnores = (?s)(\\begin\{equation\}.*?\\end\{equation\}), \
               (?s)(\\begin\{align\}.*?\\end\{align\}), \
               (?s)(\\begin\{tabular\}.*?\\end\{tabular\}), \
               (?s)(\\begin\{verbatim\}.*?\\end\{verbatim\}), \
               (?s)(\\begin\{lstlisting\}.*?\\end\{lstlisting\})

# Disable noisy rules for academic writing
Microsoft.Contractions = NO
Microsoft.We = NO
Microsoft.FirstPerson = NO
Microsoft.Passive = NO
Microsoft.Wordiness = warning
Microsoft.Vocab = NO
Microsoft.GeneralURL = NO
Microsoft.Acronyms = NO
